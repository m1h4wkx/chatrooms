<title>¿Buscas una aventura diferente? 😉</title>

<link rel="stylesheet" href="css/style.css">


</head>

<body>


<video
    id="backgroundVideo"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
></video>

<div class="overlay"></div>

<main class="page">

    <div class="card">

        <h1>
            😉 Hay alguien que quiere conocerte
        </h1>

        <p class="description">
            Descubre nuevas conexiones cerca de ti. 🔥
        </p>

        <div class="buttons">

            <button
                id="yesButton"
                class="btn btn-yes"
                type="button"
            >
                Sí, Acepto
            </button>

            <button
                id="noButton"
                class="btn btn-no"
                type="button"
            >
                No
            </button>

        </div>

    </div>

</main>
